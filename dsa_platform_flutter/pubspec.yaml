name: algoforge
description: AlgoForge — Adaptive DSA Learning & Revision Platform
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Flutter SDK versions — NOT Node.js versions)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_functions: ^0.0.1-dev

  # State Management
  provider: ^6.1.1

  # Local Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.66.0

  # HTTP
  dio: ^5.4.0
  http: ^1.2.0

  # Local Notifications (free — no FCM needed)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # UI — google_fonts downloads fonts automatically, no assets/fonts/ needed
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
